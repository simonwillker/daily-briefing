<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Briefing</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #d97757;
    --border: #e5e3df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19;
      --card: #232322;
      --text: #f0efec;
      --muted: #9a9994;
      --border: #3a3a38;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    padding: 32px 16px 64px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  header .date { color: var(--muted); font-size: 14px; margin-bottom: 4px; }
  header h1 { margin: 0; font-size: 28px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .card h2 {
    margin: 0 0 12px;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  .card ul { margin: 0; padding-left: 20px; }
  .card li { margin-bottom: 8px; line-height: 1.5; }
  .weather-row { display: flex; align-items: baseline; gap: 16px; }
  .weather-row .temp { font-size: 32px; font-weight: 600; }
  .placeholder-note {
    font-size: 13px;
    color: var(--muted);
    margin-top: 32px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="date" id="today"></div>
      <h1>Daily Briefing</h1>
    </header>

    <div class="card">
      <h2>Weather — 柏市 (Kashiwa, Chiba)</h2>
      <div class="weather-row">
        <span class="temp">--°C</span>
        <span>天気情報は毎朝 8:00 に自動更新されます</span>
      </div>
    </div>

    <div class="card">
      <h2>Top News</h2>
      <ul>
        <li>最新のニュース項目はここに表示されます。</li>
      </ul>
    </div>

    <div class="card">
      <h2>AI / Tech Industry Watch</h2>
      <ul>
        <li>AI・テック業界の最新動向はここに表示されます。</li>
      </ul>
    </div>

    <p class="placeholder-note">
      このページは Daily Briefing ルーティン用の表示テンプレートです。<br>
      現在はサンプル表示です — 実際のブリーフィング内容と連携するには追加設定が必要です。
    </p>
  </div>

  <script>
    document.getElementById('today').textContent = new Date().toLocaleDateString('ja-JP', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
  </script>
</body>
</html>
